<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lazio</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=UnifrakturCook:wght@700&family=Inter:wght@300;400;600&display=swap">
<style>
:root{--fg:#f7f7f4;--mute:#d3d7d2;--gold:#f0dfae}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:#000;color:var(--fg);font-family:Inter,system-ui,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent}
.goth{font-family:"UnifrakturCook","Old English Text MT",Georgia,serif;font-weight:700}

#gate{position:fixed;inset:0;z-index:20;background:#000;display:grid;place-items:center;cursor:pointer;transition:opacity 1s,visibility 1s}
#gate span{font-size:2.1rem;letter-spacing:.05em;animation:pulse 2.6s ease-in-out infinite}
#gate.out{opacity:0;visibility:hidden}
@keyframes pulse{50%{opacity:.3}}

/* nền */
#bgwrap{position:fixed;inset:0;background:radial-gradient(120% 90% at 50% 0%,#3b4a4a,#10161a 70%,#05080a)}
#bgwrap video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:saturate(.9) brightness(.85) contrast(1.05)}
#rain{position:absolute;inset:0;width:100%;height:100%;opacity:.5}
.orb{position:fixed;border-radius:50%;filter:blur(60px);opacity:.55;pointer-events:none;mix-blend-mode:screen}
.o1{width:300px;height:300px;left:-80px;top:12%;background:#3a6dff;animation:d1 18s ease-in-out infinite alternate}
.o2{width:280px;height:280px;right:-90px;bottom:8%;background:#c0488f;animation:d2 22s ease-in-out infinite alternate}
@keyframes d1{to{transform:translate(120px,80px)}}
@keyframes d2{to{transform:translate(-110px,-90px)}}
#vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(90% 75% at 50% 45%,transparent 35%,rgba(0,0,0,.7)),linear-gradient(180deg,rgba(0,0,0,.3),transparent 30%,rgba(0,0,0,.5))}

/* ===== LIQUID GLASS (kiểu iOS 26) ===== */
.glass{position:relative;isolation:isolate;border:1px solid rgba(255,255,255,.22);
  background:linear-gradient(145deg,rgba(255,255,255,.2),rgba(255,255,255,.05) 45%,rgba(255,255,255,.1));
  -webkit-backdrop-filter:blur(16px) saturate(1.9) brightness(1.08);backdrop-filter:blur(16px) saturate(1.9) brightness(1.08);
  box-shadow:inset 0 1.5px 0 rgba(255,255,255,.65),inset 0 -1.5px 1px rgba(255,255,255,.18),inset 1.5px 0 1px rgba(255,255,255,.2),inset -1.5px 0 1px rgba(255,255,255,.2),inset 0 0 26px rgba(255,255,255,.07),0 14px 40px rgba(0,0,0,.38)}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;z-index:-1;pointer-events:none;
  background:radial-gradient(180px circle at var(--mx,30%) var(--my,0%),rgba(255,255,255,.34),transparent 62%)}
.glass::after{content:"";position:absolute;left:10%;right:10%;top:1px;height:38%;border-radius:inherit;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,255,255,.2),transparent)}
.refract{-webkit-backdrop-filter:url(#lg) blur(10px) saturate(1.9) brightness(1.08);backdrop-filter:url(#lg) blur(10px) saturate(1.9) brightness(1.08)}
.press{transition:transform .35s cubic-bezier(.3,1.6,.5,1),background .2s;cursor:pointer}
.press:hover{transform:scale(1.05)}
.press:active{transform:scale(.93)}

main{position:relative;z-index:2;height:100%;display:grid;place-items:center;padding:calc(env(safe-area-inset-top,0px) + 14px) 16px calc(env(safe-area-inset-bottom,0px) + 14px);opacity:0;transform:scale(.96) translateY(10px);transition:opacity 1.4s .3s,transform 1.4s .3s cubic-bezier(.2,.9,.3,1)}
main.on{opacity:1;transform:none}
.card{width:min(430px,100%);padding:92px 22px 22px;text-align:center;border-radius:42px;transition:transform .2s ease-out}

.av{position:absolute;left:50%;top:0;width:148px;height:148px;margin:-74px 0 0 -74px;border-radius:50%;padding:4px;border:0;cursor:pointer;
  background:conic-gradient(from 0deg,#fff6d6,#c9a24a,#fff,#8c6d2b,#fff6d6);box-shadow:0 0 0 7px rgba(255,255,255,.1),0 0 44px rgba(240,223,174,.5);animation:rot 16s linear infinite}
.av img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block;background:#111;animation:rot 16s linear infinite reverse}
@keyframes rot{to{transform:rotate(360deg)}}

h1{font-size:3.7rem;line-height:1;letter-spacing:.01em;background:linear-gradient(100deg,#fff 20%,var(--gold) 45%,#fff 70%);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 6s ease-in-out infinite;filter:drop-shadow(0 4px 18px rgba(0,0,0,.45))}
@keyframes shine{50%{background-position:-120% 0}}
.kj{margin-top:6px;font-family:"Noto Serif CJK JP","Hiragino Mincho ProN",serif;color:var(--gold);letter-spacing:.5em;padding-left:.5em;font-size:1.05rem;opacity:.9}
.bio{margin-top:12px;min-height:1.4em;color:var(--mute);font-size:1.12rem;font-weight:400}
.bio::after{content:"";display:inline-block;width:1px;height:1.05em;margin-left:3px;background:var(--gold);vertical-align:-2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

/* đang phát */
.np{margin-top:24px;display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:26px;text-align:left}
.cover{width:48px;height:48px;flex:none;border-radius:14px;background:conic-gradient(from 200deg,#2b5fa8,#f0dfae,#c0488f,#2b5fa8);box-shadow:inset 0 0 0 1px rgba(255,255,255,.4)}
.np .t{flex:1;min-width:0}
.np b{display:block;font-weight:600;font-size:.98rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np small{color:var(--mute);font-size:.8rem}
.bars{display:flex;gap:3px;align-items:flex-end;height:20px}
.bars i{width:3px;border-radius:2px;background:#fff;height:30%;animation:eq 1s ease-in-out infinite}
.bars i:nth-child(2){animation-delay:.2s}.bars i:nth-child(3){animation-delay:.45s}.bars i:nth-child(4){animation-delay:.1s}
.paused .bars i{animation-play-state:paused;height:25%}
@keyframes eq{50%{height:100%}}
.pp{width:42px;height:42px;flex:none;border-radius:50%;border:0;color:#fff;display:grid;place-items:center}
.pp svg{width:20px;height:20px;fill:currentColor}

/* ô thông tin */
.tiles{margin-top:12px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{padding:16px 10px;border-radius:26px}
.tile .v{font-size:1.55rem;font-weight:300;letter-spacing:.02em;font-variant-numeric:tabular-nums}
.tile .l{margin-top:2px;font-size:.78rem;color:var(--mute)}

/* dock mạng xã hội */
.dock{margin:14px auto 0;width:fit-content;max-width:100%;display:flex;gap:8px;padding:8px;border-radius:99px}
.dock a{padding:11px 18px;border-radius:99px;color:#fff;text-decoration:none;font-size:1.1rem;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
.dock a:hover{background:rgba(255,255,255,.22)}

.snd{position:fixed;z-index:5;left:calc(env(safe-area-inset-left,0px) + 14px);top:calc(env(safe-area-inset-top,0px) + 14px);width:48px;height:48px;border-radius:50%;border:1px solid rgba(255,255,255,.22);color:#fff;display:grid;place-items:center}
.snd svg{width:22px;height:22px}
a:focus-visible,button:focus-visible{outline:2px solid #fff;outline-offset:3px}
@media(max-width:400px){h1{font-size:3.2rem}.av{width:128px;height:128px;margin:-64px 0 0 -64px}.card{padding-top:80px}.dock a{padding:10px 14px;font-size:1rem}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="lg" x="-5%" y="-5%" width="110%" height="110%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.012 0.018" numOctaves="2" seed="7" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="22" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>

<div id="gate" role="button" tabindex="0" aria-label="Click to enter"><span class="goth">click to enter</span></div>
<div id="bgwrap"><canvas id="rain"></canvas><video id="vid" muted loop playsinline preload="auto"></video></div>
<div class="orb o1"></div><div class="orb o2"></div>
<div id="vig"></div>

<button class="snd glass press" id="snd" aria-label="Bật/tắt nhạc"></button>

<main id="page">
  <section class="card glass" id="card">
    <button class="av" id="avBtn" aria-label="Đổi avatar"><img id="avImg" alt="Avatar" referrerpolicy="no-referrer"></button>
    <h1 class="goth" id="nm"></h1>
    <div class="kj" id="kanji"></div>
    <p class="bio goth" id="bio" style="font-weight:400"></p>

    <div class="np glass" id="np">
      <div class="cover"></div>
      <div class="t"><b id="song"></b><small id="artist"></small></div>
      <div class="bars"><i></i><i></i><i></i><i></i></div>
      <button class="pp glass press" id="pp" aria-label="Phát/dừng"></button>
    </div>

    <div class="tiles">
      <div class="tile glass"><div class="v" id="clock">--:--</div><div class="l">Giờ Việt Nam</div></div>
      <div class="tile glass"><div class="v goth" id="place" style="font-weight:400"></div><div class="l">Đang ở</div></div>
    </div>

    <nav class="dock glass" id="dock"></nav>
  </section>
  <input type="file" id="fAv" accept="image/*" hidden>
</main>

<script>
(function(){
  /* ===== CẤU HÌNH: sửa thông tin của bạn ở đây ===== */
  var CFG = {
    name: "Lazio",
    kanji: "神",
    bio: "xin đời 2 chữ bình yên",
    place: "ur heart",
    song: "Ambient · Mưa đêm", artist: "Lazio's playlist",
    socials: [{n:"Discord",u:"#"},{n:"Instagram",u:"#"},{n:"TikTok",u:"#"}],
    avatar: "https://i.pinimg.com/736x/07/59/b3/0759b3f03a2d3a21e050caf7cfc9e5f8.jpg",
    video: "https://assets.mixkit.co/videos/18308/18308-720.mp4",
    music: "" /* dán link .mp3 để có nhạc thật; để trống = nhạc ambient tạo sẵn */
  };
  var $=function(i){return document.getElementById(i)};
  $("nm").textContent=CFG.name; $("kanji").textContent=CFG.kanji; $("place").textContent=CFG.place;
  $("song").textContent=CFG.song; $("artist").textContent=CFG.artist;
  CFG.socials.forEach(function(s){var a=document.createElement("a");a.href=s.u;a.target="_blank";a.rel="noopener";a.className="goth press";a.textContent=s.n;$("dock").appendChild(a)});
  $("avImg").src=CFG.avatar;
  $("avImg").onerror=function(){this.onerror=null;this.src="data:image/svg+xml,"+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#14191d"/><text x="50" y="66" font-size="48" text-anchor="middle">🌙</text></svg>')};

  /* refraction chỉ bật trên Chromium (Safari chưa hỗ trợ url() trong backdrop-filter) */
  if(window.chrome&&!/iPhone|iPad/.test(navigator.userAgent))document.querySelectorAll(".glass").forEach(function(e){e.classList.add("refract")});

  /* ánh sáng lướt theo ngón tay / chuột */
  var card=$("card");
  function light(x,y){document.querySelectorAll(".glass").forEach(function(e){var r=e.getBoundingClientRect();e.style.setProperty("--mx",(x-r.left)+"px");e.style.setProperty("--my",(y-r.top)+"px")})}
  addEventListener("pointermove",function(e){light(e.clientX,e.clientY);
    if(matchMedia("(hover:hover)").matches)card.style.transform="perspective(900px) rotateX("+((e.clientY/innerHeight-.5)*-5)+"deg) rotateY("+((e.clientX/innerWidth-.5)*6)+"deg)"});
  addEventListener("pointerdown",function(e){light(e.clientX,e.clientY)});

  /* đồng hồ */
  function tick(){try{$("clock").textContent=new Date().toLocaleTimeString("vi-VN",{timeZone:"Asia/Ho_Chi_Minh",hour:"2-digit",minute:"2-digit"})}catch(e){}}
  tick();setInterval(tick,10000);

  /* video + mưa dự phòng */
  var vid=$("vid");vid.src=CFG.video;vid.addEventListener("playing",function(){$("rain").style.display="none"});
  (function(){var c=$("rain"),x=c.getContext("2d"),w,h,d=[];
    function size(){w=c.width=innerWidth;h=c.height=innerHeight;d=[];for(var i=0;i<Math.floor(w/9);i++)d.push({x:Math.random()*w,y:Math.random()*h,l:10+Math.random()*18,s:8+Math.random()*10})}
    size();addEventListener("resize",size);
    (function f(){if(c.style.display==="none")return;x.clearRect(0,0,w,h);x.strokeStyle="rgba(190,210,230,.35)";x.beginPath();
      d.forEach(function(p){x.moveTo(p.x,p.y);x.lineTo(p.x-2,p.y+p.l);p.y+=p.s;if(p.y>h){p.y=-20;p.x=Math.random()*w}});x.stroke();requestAnimationFrame(f)})()})();

  /* nhạc */
  var on=false,ctx,master,audioEl;
  var ON='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 4V5L7 9H3zm13.500 3A4.500 4.500 0 0 0 14 8v8a4.500 4.500 0 0 0 2.500-4zM14 3.200v2.100a7 7 0 0 1 0 13.400v2.100a9 9 0 0 0 0-17.600z"/></svg>';
  var OFF='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 4V5L7 9H3zm15.500 3 2.500-2.500-1.400-1.400L17 10.600l-2.600-2.500-1.400 1.400 2.600 2.500-2.600 2.500 1.400 1.400 2.600-2.500 2.600 2.500 1.400-1.400z"/></svg>';
  var PLAY='<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>',PAUSE='<svg viewBox="0 0 24 24"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>';
  function ambient(){var AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
    ctx=new AC();master=ctx.createGain();master.gain.value=0;master.connect(ctx.destination);
    var lp=ctx.createBiquadFilter();lp.type="lowpass";lp.frequency.value=900;lp.connect(master);
    [[110,0],[164.8,4],[220,-3],[277.2,6],[329.6,-5]].forEach(function(n,i){
      var o=ctx.createOscillator(),g=ctx.createGain();o.type=i%2?"sine":"triangle";o.frequency.value=n[0];o.detune.value=n[1];g.gain.value=.07;
      var l=ctx.createOscillator(),lg=ctx.createGain();l.frequency.value=.07+i*.03;lg.gain.value=.035;
      l.connect(lg);lg.connect(g.gain);o.connect(g);g.connect(lp);o.start();l.start()});
    setInterval(function(){if(!on)return;var o=ctx.createOscillator(),g=ctx.createGain();o.type="sine";o.frequency.value=[440,523.3,659.3,784,880][Math.floor(Math.random()*5)];
      g.gain.setValueAtTime(0,ctx.currentTime);g.gain.linearRampToValueAtTime(.05,ctx.currentTime+.05);g.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+3.5);
      o.connect(g);g.connect(master);o.start();o.stop(ctx.currentTime+3.6)},3200)}
  function setSound(s){on=s;$("snd").innerHTML=s?ON:OFF;$("pp").innerHTML=s?PAUSE:PLAY;$("np").classList.toggle("paused",!s);
    if(audioEl){s?audioEl.play().catch(function(){}):audioEl.pause()}
    else if(master){if(ctx.state==="suspended")ctx.resume();master.gain.linearRampToValueAtTime(s?.9:0,ctx.currentTime+1.2)}}
  $("snd").onclick=$("pp").onclick=function(){setSound(!on)};$("snd").innerHTML=ON;$("pp").innerHTML=PAUSE;

  function type(){var t=CFG.bio,i=0,el=$("bio");(function n(){var s=t.slice(0,i);el.firstChild?el.firstChild.nodeValue=s:el.insertBefore(document.createTextNode(s),el.firstChild);if(i++<t.length)setTimeout(n,70)})()}
  var gate=$("gate");
  function enter(){if(gate.classList.contains("out"))return;gate.classList.add("out");$("page").classList.add("on");vid.play().catch(function(){});
    if(CFG.music){audioEl=new Audio(CFG.music);audioEl.loop=true;audioEl.volume=.6}else ambient();setSound(true);setTimeout(type,900)}
  gate.onclick=enter;gate.onkeydown=function(e){if(e.key==="Enter"||e.key===" ")enter()};

  $("avBtn").onclick=function(){$("fAv").click()};
  $("fAv").onchange=function(){var f=this.files[0];if(f)$("avImg").src=URL.createObjectURL(f)};
})();
</script>
</body>
</html>
