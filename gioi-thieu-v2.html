<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>zackwo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=UnifrakturCook:wght@700&family=Inter:wght@300;400;600&display=swap">
<style>
:root{--fg:#f5f5f2;--mute:#c4c8c2;--gold:#e9d8a6;--glass:rgba(14,16,15,.42);--line:rgba(255,255,255,.16)}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:#000;color:var(--fg);font-family:Inter,system-ui,sans-serif;overflow:hidden}
.goth{font-family:"UnifrakturCook","Old English Text MT",Georgia,serif;font-weight:700}

/* cổng vào */
#gate{position:fixed;inset:0;z-index:20;background:#000;display:grid;place-items:center;cursor:pointer;transition:opacity 1s,visibility 1s}
#gate span{font-size:2.1rem;letter-spacing:.05em;animation:pulse 2.6s ease-in-out infinite}
#gate.out{opacity:0;visibility:hidden}
@keyframes pulse{50%{opacity:.3}}

/* nền video + dự phòng */
#bgwrap{position:fixed;inset:0;background:radial-gradient(120% 90% at 50% 0%,#3b4a4a,#10161a 70%,#05080a)}
#bgwrap video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:saturate(.75) brightness(.78) contrast(1.05)}
#rain{position:absolute;inset:0;width:100%;height:100%;opacity:.5}
#vig{position:fixed;inset:0;background:radial-gradient(90% 75% at 50% 45%,transparent 30%,rgba(0,0,0,.75)),linear-gradient(180deg,rgba(0,0,0,.35),transparent 30%,rgba(0,0,0,.55))}

/* bố cục */
main{position:relative;z-index:2;height:100%;display:grid;place-items:center;padding:calc(env(safe-area-inset-top,0px) + 16px) 18px calc(env(safe-area-inset-bottom,0px) + 16px);opacity:0;transform:scale(.97);transition:opacity 1.4s .3s,transform 1.4s .3s}
main.on{opacity:1;transform:none}
.card{position:relative;width:min(440px,100%);padding:96px 28px 28px;text-align:center;border-radius:30px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(18px) saturate(1.2);-webkit-backdrop-filter:blur(18px) saturate(1.2);box-shadow:0 30px 80px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.18);transition:transform .2s ease-out}
.card::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;background:linear-gradient(160deg,rgba(233,216,166,.7),transparent 35%,transparent 65%,rgba(233,216,166,.35));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}

/* avatar */
.av{position:absolute;left:50%;top:0;transform:translate(-50%,-50%);width:150px;height:150px;border-radius:50%;padding:5px;background:conic-gradient(from 0deg,#fff3c9,#c9a24a,#fff,#8c6d2b,#fff3c9);box-shadow:0 0 0 8px rgba(255,255,255,.06),0 0 40px rgba(233,216,166,.45);animation:spin 16s linear infinite;border:0;cursor:pointer}
.av img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block;background:#111;animation:spin 16s linear infinite reverse}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
.av{animation-name:spinav}
.av img{animation-name:spinimg}
@keyframes spinav{to{transform:translate(-50%,-50%) rotate(360deg)}}
@keyframes spinimg{to{transform:rotate(-360deg)}}

h1{font-size:2.7rem;line-height:1;display:flex;justify-content:center;align-items:center;gap:12px}
h1 small{font-family:"Noto Serif CJK JP","Hiragino Mincho ProN",serif;font-size:1.9rem;color:var(--gold)}
.bio{margin:14px auto 0;min-height:1.4em;color:var(--mute);font-weight:300;font-size:1.08rem;letter-spacing:.02em}
.bio::after{content:"";display:inline-block;width:1px;height:1.05em;margin-left:3px;background:var(--gold);vertical-align:-2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.rule{height:1px;margin:22px auto;width:62%;background:linear-gradient(90deg,transparent,var(--gold),transparent);opacity:.6}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chips span{padding:8px 14px;border-radius:99px;font-size:.92rem;background:rgba(255,255,255,.07);border:1px solid var(--line)}
.loc{margin-top:18px;display:flex;justify-content:center;align-items:center;gap:8px;font-size:1.2rem;color:var(--gold)}
.loc svg{width:20px;height:20px;fill:currentColor}
.stats{margin-top:22px;display:flex;justify-content:center;align-items:center;gap:20px;font-size:1.05rem}
.stats button{background:none;border:0;color:inherit;font:inherit;display:flex;gap:8px;align-items:center;cursor:pointer}
.stats svg{width:24px;height:24px;fill:#fff;transition:fill .25s,transform .25s}
.stats .liked svg{fill:#ff4d6d;transform:scale(1.15)}
.stats i{width:1px;height:20px;background:var(--line)}

/* nút loa */
.snd{position:fixed;z-index:5;left:calc(env(safe-area-inset-left,0px) + 16px);top:calc(env(safe-area-inset-top,0px) + 16px);width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:var(--glass);color:#fff;display:grid;place-items:center;cursor:pointer;backdrop-filter:blur(10px)}
.snd svg{width:22px;height:22px}
.snd:focus-visible,.av:focus-visible,.stats button:focus-visible{outline:2px solid #fff;outline-offset:3px}
@media(max-width:420px){h1{font-size:2.3rem}.av{width:128px;height:128px}.card{padding-top:84px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="gate" role="button" tabindex="0" aria-label="Click to enter"><span class="goth">click to enter</span></div>

<div id="bgwrap">
  <canvas id="rain"></canvas>
  <video id="vid" muted loop playsinline preload="auto"></video>
</div>
<div id="vig"></div>

<button class="snd" id="snd" aria-label="Bật/tắt nhạc"></button>

<main id="page">
  <section class="card" id="card">
    <button class="av" id="avBtn" aria-label="Đổi avatar"><img id="avImg" alt="Avatar" referrerpolicy="no-referrer"></button>
    <h1 class="goth"><small id="kanji"></small><span id="nm"></span></h1>
    <p class="bio goth" id="bio" style="font-weight:400"></p>
    <div class="rule"></div>
    <div class="chips" id="chips"></div>
    <div class="loc goth"><svg viewBox="0 0 24 24"><path d="M12 2a7 7 0 0 0-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 0 0-7-7zm0 9.500A2.500 2.500 0 1 1 12 6a2.500 2.500 0 0 1 0 5.500z"/></svg><span id="place"></span></div>
    <div class="stats">
      <button id="like" aria-label="Thích"><svg viewBox="0 0 24 24"><path d="M12 21s-8-5.200-8-11a4.600 4.600 0 0 1 8-3 4.600 4.600 0 0 1 8 3c0 5.800-8 11-8 11z"/></svg><span id="likes"></span></button>
      <i></i>
      <span style="display:flex;gap:8px;align-items:center"><svg viewBox="0 0 24 24"><path d="M12 5C6.500 5 2.700 9.200 1.500 12c1.200 2.800 5 7 10.500 7s9.300-4.200 10.500-7C21.300 9.200 17.500 5 12 5zm0 11a4 4 0 1 1 0-8 4 4 0 0 1 0 8zm0-6a2 2 0 1 0 0 4 2 2 0 0 0 0-4z"/></svg><span id="views"></span></span>
    </div>
  </section>
  <input type="file" id="fAv" accept="image/*" hidden>
</main>

<script>
(function(){
  /* ===== CẤU HÌNH: sửa thông tin của bạn ở đây ===== */
  var CFG = {
    name: "zackwo",
    kanji: "神",
    bio: "xin đời 2 chữ bình yên",
    place: "ur heart",
    chips: ["🎧 Nghe nhạc", "💻 Code", "🎮 Game", "🌧️ Mê trời mưa"],
    likes: 999, views: 12347,
    avatar: "https://i.pinimg.com/736x/07/59/b3/0759b3f03a2d3a21e050caf7cfc9e5f8.jpg",
    video: "https://assets.mixkit.co/videos/18308/18308-720.mp4",
    music: "" /* dán link .mp3 để có nhạc thật; để trống = nhạc ambient tạo sẵn */
  };

  var $=function(i){return document.getElementById(i)};
  $("nm").textContent=CFG.name; $("kanji").textContent=CFG.kanji; $("place").textContent=CFG.place;
  $("likes").textContent=CFG.likes;
  CFG.chips.forEach(function(t){var s=document.createElement("span");s.textContent=t;$("chips").appendChild(s)});
  $("avImg").src=CFG.avatar;
  $("avImg").onerror=function(){this.onerror=null;this.src="data:image/svg+xml,"+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#14191d"/><text x="50" y="66" font-size="48" text-anchor="middle">🌙</text></svg>')};
  try{var v=parseInt(localStorage.getItem("zv")||CFG.views,10)+1;localStorage.setItem("zv",v);$("views").textContent=v.toLocaleString("en-US")}catch(e){$("views").textContent=CFG.views.toLocaleString("en-US")}

  /* video nền */
  var vid=$("vid"); vid.src=CFG.video;
  vid.addEventListener("playing",function(){$("rain").style.display="none"});

  /* mưa dự phòng (hiện khi video chưa tải / lỗi) */
  (function(){
    var c=$("rain"),x=c.getContext("2d"),w,h,d=[];
    function size(){w=c.width=innerWidth;h=c.height=innerHeight;d=[];for(var i=0;i<Math.floor(w/9);i++)d.push({x:Math.random()*w,y:Math.random()*h,l:10+Math.random()*18,s:8+Math.random()*10})}
    size();addEventListener("resize",size);
    (function f(){if(c.style.display==="none")return;x.clearRect(0,0,w,h);x.strokeStyle="rgba(190,210,230,.35)";x.lineWidth=1;x.beginPath();
      d.forEach(function(p){x.moveTo(p.x,p.y);x.lineTo(p.x-2,p.y+p.l);p.y+=p.s;if(p.y>h){p.y=-20;p.x=Math.random()*w}});x.stroke();requestAnimationFrame(f)})();
  })();

  /* nhạc */
  var on=false,ctx,master,audioEl;
  var ON='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 4V5L7 9H3zm13.500 3A4.500 4.500 0 0 0 14 8v8a4.500 4.500 0 0 0 2.500-4zM14 3.200v2.100a7 7 0 0 1 0 13.400v2.100a9 9 0 0 0 0-17.600z"/></svg>';
  var OFF='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 4V5L7 9H3zm15.500 3 2.500-2.500-1.400-1.400L17 10.600l-2.600-2.500-1.400 1.400 2.600 2.500-2.600 2.500 1.400 1.400 2.600-2.500 2.600 2.500 1.400-1.400z"/></svg>';
  function ambient(){
    var AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
    ctx=new AC();master=ctx.createGain();master.gain.value=0;master.connect(ctx.destination);
    var lp=ctx.createBiquadFilter();lp.type="lowpass";lp.frequency.value=900;lp.connect(master);
    [[110,0],[164.8,4],[220,-3],[277.2,6],[329.6,-5]].forEach(function(n,i){
      var o=ctx.createOscillator(),g=ctx.createGain();o.type=i%2?"sine":"triangle";o.frequency.value=n[0];o.detune.value=n[1];g.gain.value=.07;
      var l=ctx.createOscillator(),lg=ctx.createGain();l.frequency.value=.07+i*.03;lg.gain.value=.035;
      l.connect(lg);lg.connect(g.gain);o.connect(g);g.connect(lp);o.start();l.start()});
    setInterval(function(){if(!on)return;var o=ctx.createOscillator(),g=ctx.createGain();
      o.type="sine";o.frequency.value=[440,523.3,659.3,784,880][Math.floor(Math.random()*5)];
      g.gain.setValueAtTime(0,ctx.currentTime);g.gain.linearRampToValueAtTime(.05,ctx.currentTime+.05);g.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+3.5);
      o.connect(g);g.connect(master);o.start();o.stop(ctx.currentTime+3.6)},3200);
  }
  function setSound(s){on=s;$("snd").innerHTML=s?ON:OFF;
    if(audioEl){s?audioEl.play().catch(function(){}):audioEl.pause()}
    else if(master){if(ctx.state==="suspended")ctx.resume();master.gain.linearRampToValueAtTime(s?.9:0,ctx.currentTime+1.2)}}
  $("snd").innerHTML=ON;$("snd").onclick=function(){setSound(!on)};

  /* gõ chữ bio */
  function type(){var t=CFG.bio,i=0,el=$("bio");(function n(){el.firstChild?el.firstChild.nodeValue=t.slice(0,i):el.insertBefore(document.createTextNode(t.slice(0,i)),el.firstChild);if(i++<t.length)setTimeout(n,70)})()}

  /* vào trang */
  function enter(){
    if(gate.classList.contains("out"))return;
    gate.classList.add("out");$("page").classList.add("on");
    vid.play().catch(function(){});
    if(CFG.music){audioEl=new Audio(CFG.music);audioEl.loop=true;audioEl.volume=.6}else ambient();
    setSound(true);setTimeout(type,900);
  }
  var gate=$("gate");gate.onclick=enter;gate.onkeydown=function(e){if(e.key==="Enter"||e.key===" ")enter()};

  /* thả tim */
  var likes=CFG.likes,liked=false;
  $("like").onclick=function(){liked=!liked;likes+=liked?1:-1;$("likes").textContent=likes;this.classList.toggle("liked",liked)};

  /* đổi avatar */
  $("avBtn").onclick=function(){$("fAv").click()};
  $("fAv").onchange=function(){var f=this.files[0];if(f)$("avImg").src=URL.createObjectURL(f)};

  /* nghiêng nhẹ theo chuột (chỉ trên máy tính) */
  var card=$("card");
  if(matchMedia("(hover:hover)").matches){
    addEventListener("mousemove",function(e){var rx=(e.clientY/innerHeight-.5)*-5,ry=(e.clientX/innerWidth-.5)*6;card.style.transform="perspective(900px) rotateX("+rx+"deg) rotateY("+ry+"deg)"});
  }
})();
</script>
</body>
</html>
